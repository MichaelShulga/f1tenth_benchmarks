name: Full reproduction and release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag
        required: true
        default: reproduction-v1.0.1

permissions:
  contents: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install locked Pixi environment
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.77.0
          frozen: true
          cache: true

      - name: Run existing benchmark entry point
        run: |
          pixi run python -m \
            f1tenth_benchmarks.benchmark_results.generate_benchmark_results

      - name: Execute existing report notebook
        run: |
          pixi run jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=-1 \
            f1tenth_benchmarks/benchmark_results/benchmark_result_plots.ipynb

      - name: Package natural outputs
        run: |
          mkdir -p release-assets
          cp f1tenth_benchmarks/benchmark_results/benchmark_result_plots.ipynb \
            release-assets/benchmark_result_plots.executed.ipynb
          tar -czf release-assets/benchmark-article-data.tar.gz \
            Data/BenchmarkArticle
          tar -czf release-assets/raw-logs.tar.gz Logs

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.release_tag }}" \
            release-assets/* \
            --target "$GITHUB_SHA" \
            --title "F1TENTH article reproduction ${{ inputs.release_tag }}" \
            --notes "Locked Pixi reproduction using the existing benchmark entry point and report notebook."
