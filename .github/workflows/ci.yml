name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Pixi environment
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.77.0
          frozen: true
          cache: true

      - name: Verify imports and versions
        run: |
          pixi run python - <<'PY'
          import sys
          import casadi
          import numba
          import numpy
          import scipy
          import torch
          import trajectory_planning_helpers
          import f1tenth_benchmarks.simulator

          print("python", sys.version)
          print("numpy", numpy.__version__)
          print("numba", numba.__version__)
          print("scipy", scipy.__version__)
          print("casadi", casadi.__version__)
          print("torch", torch.__version__)
          PY

      - name: Run existing smoke benchmark
        run: pixi run python -m f1tenth_benchmarks.run_scripts.mapless_racing

      - name: Verify nbconvert
        run: pixi run jupyter nbconvert --version
